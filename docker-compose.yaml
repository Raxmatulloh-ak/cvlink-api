services:
    php:
        container_name: ${DOCKER_PROJECT_NAME}_php
        build: ./docker/php
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/php.ini
        depends_on:
            - database

    nginx:
        container_name: ${DOCKER_PROJECT_NAME}_nginx
        image: nginx:1.28.0
        restart: unless-stopped
        volumes:
            - ./docker/nginx/logs:/var/log/nginx
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        ports:
            - 127.0.0.1:${DOCKER_NGINX_PORT}:80

    database:
        image: postgres:16-alpine
        container_name: ${DOCKER_PROJECT_NAME}_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DOCKER_PROJECT_NAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_USER: ${DOCKER_PROJECT_NAME}_client
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${DOCKER_PROJECT_NAME}", "-U", "${DOCKER_PROJECT_NAME}_client"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - ./docker/postgresql/db:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:${DOCKER_DATABASE_PORT}:5432
